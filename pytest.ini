[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short --strict-markers
markers =
    unit: pure logic tests with no I/O
    integration: requires DB or external service
filterwarnings =
    ignore::DeprecationWarning:flask_caching.*
    ignore::DeprecationWarning:flask_sqlalchemy.*
